
name: Deploy WordPress Theme to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy Theme via FTPS
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" ftp://ftpupload.net <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate yes
          set net:timeout 30
          set net:max-retries 2

          mirror --reverse --verbose --parallel=1 \
            --exclude-glob .git \
            --exclude-glob .github \
            ./ \
            /htdocs/wp-content/themes/gwt-wordpress-gwt-wordpress-26.0.0/

          bye
          EOF
